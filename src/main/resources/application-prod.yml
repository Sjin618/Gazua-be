spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${localhost:localhost}:3306/${DBNAME:acc}
    username: ${USERNAME:root}
    password: ${PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate # 기존 테이블과 엔티티가 맞는지만 체크
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect